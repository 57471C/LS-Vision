[package]
name = "ls-vision"
version = "0.2.2"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ls_vision_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
native-tls = "0.2"
url = "2"
base64 = "0.22"
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
turbojpeg = "=1.5.1"
rxing = { version = "0.9.3", default-features = false, features = ["image", "decoders", "encoders", "encoding_rs", "oned", "qrcode"] }
ort = { version = "=2.0.0-rc.14", features = ["ndarray", "download-binaries", "copy-dylibs"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
